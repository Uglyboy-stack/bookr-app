<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookr for Providers — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>

  <header class="site-header">
    <span class="logo-mark">B</span>
    <span class="logo-text">Bookr</span>
    <span class="provider-badge">for Providers</span>
    <a href="index.html" class="header-link">Client view</a>
    <button class="logout-link" id="logoutBtn" style="margin-left:16px;">Log out</button>
  </header>

  <div class="dash-shell">
    <nav class="dash-nav" id="dashNav">
      <button class="dash-nav-item active" data-tab="overview">Overview</button>
      <button class="dash-nav-item" data-tab="services">Services</button>
      <button class="dash-nav-item" data-tab="availability">Availability</button>
      <button class="dash-nav-item" data-tab="bookings">Bookings</button>
    </nav>

    <main id="dashContent" class="dash-content"></main>
  </div>

  <script src="auth.js"></script>
  <script>
    // Guard: bounce to login if there's no active session
    if (!isLoggedIn()) {
      window.location.href = "login.html";
    }
  </script>
  <script src="dashboard-data.js"></script>
  <script src="dashboard.js"></script>
  <script>
    document.getElementById("logoutBtn").addEventListener("click", logOut);
  </script>
</body>
</html>
