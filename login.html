<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookr for Providers — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>

  <header class="site-header">
    <span class="logo-mark">B</span>
    <span class="logo-text">Bookr</span>
    <span class="provider-badge">for Providers</span>
    <a href="index.html" class="header-link">Client view</a>
  </header>

  <div class="login-shell">
    <form class="login-card" id="loginForm">
      <h1 class="dash-title" style="margin-bottom:4px;">Provider log in</h1>
      <p class="dash-sub">Manage your services, availability, and bookings.</p>

      <label class="login-label" for="email">Email</label>
      <input class="edit-input login-input" type="email" id="email" placeholder="you@business.com" required />

      <label class="login-label" for="password">Password</label>
      <input class="edit-input login-input" type="password" id="password" placeholder="••••••••" required />

      <p class="login-error" id="loginError" style="display:none;">Enter an email and password to continue.</p>

      <button type="submit" class="add-btn login-submit">Log in</button>
      <div class="demo-creds">
        <p class="demo-creds-title">Demo login</p>
        <p class="demo-creds-row">ada@bookr-demo.com</p>
        <p class="demo-creds-row">Password: demo1234</p>
      </div>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
